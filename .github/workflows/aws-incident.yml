
name: Trigger AWS DevOps Agent

on:
  issues:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  issues: read

jobs:
  trigger-agent:
    if: github.event.label.name == 'incident'
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: eu-north-1

      - name: Prepare incident and save mapping
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          const event = JSON.parse(
            fs.readFileSync(process.env.EVENT_PATH, "utf8")
          );

          const issue = event.issue;
          const [owner, repo] = process.env.REPOSITORY.split("/");

          const correlationId = crypto
            .createHash("sha256")
            .update(`${process.env.REPOSITORY}#${issue.number}`)
            .digest("hex");

          const timestamp = new Date().toISOString();

          const description = [
            `GitHub repository: ${process.env.REPOSITORY}`,
            `GitHub issue: #${issue.number}`,
            `GitHub issue URL: ${issue.html_url}`,
            `GITHUB_CORRELATION_ID=${correlationId}`,
            "",
            "Issue description:",
            issue.body || "No description provided"
          ].join("\n");

          const payload = {
            eventType: "incident",
            incidentId: `github-${correlationId}`,
            action: "created",
            priority: "HIGH",
            title: issue.title,
            description,
            timestamp,
            service: `GitHub/${process.env.REPOSITORY}`
          };

          const item = {
            correlation_id: { S: correlationId },
            owner: { S: owner },
            repo: { S: repo },
            issue_number: { N: String(issue.number) },
            issue_url: { S: issue.html_url },
            issue_title: { S: issue.title },
            created_at: { S: timestamp }
          };

          fs.writeFileSync(
            "/tmp/payload.json",
            JSON.stringify(payload)
          );

          fs.writeFileSync(
            "/tmp/item.json",
            JSON.stringify(item)
          );

          console.log("Prepared incident:", issue.html_url);
          console.log("Correlation ID:", correlationId);
          NODE

      - name: Save issue mapping in DynamoDB
        run: |
          aws dynamodb put-item \
            --table-name devops-agent-github-mapping \
            --item file:///tmp/item.json

      - name: Trigger AWS DevOps Agent
        env:
          WEBHOOK_URL: ${{ secrets.DEVOPS_AGENT_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.DEVOPS_AGENT_WEBHOOK_SECRET }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          async function main() {
            const payload = fs.readFileSync(
              "/tmp/payload.json",
              "utf8"
            );

            const timestamp = JSON.parse(payload).timestamp;

            const signature = crypto
              .createHmac("sha256", process.env.WEBHOOK_SECRET)
              .update(`${timestamp}:${payload}`, "utf8")
              .digest("base64");

            const response = await fetch(process.env.WEBHOOK_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "x-amzn-event-timestamp": timestamp,
                "x-amzn-event-signature": signature
              },
              body: payload
            });

            const result = await response.text();

            console.log("HTTP status:", response.status);
            console.log("Response:", result);

            if (!response.ok) {
              throw new Error("Agent webhook request failed");
            }
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
